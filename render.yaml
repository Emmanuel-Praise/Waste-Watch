services:
  - type: web
    name: wastewatch-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/data/bamenda.db
      - key: MEDIA_DIR
        value: /opt/render/project/src/backend/data/media
      - key: MESSAGE_CHANNEL
        value: whatsapp
      # Fill after deploy (empty also works — *.onrender.com is allowed).
      - key: FRONTEND_URL
        sync: false
      # --- Required: copy from your local backend/.env ---
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # --- Optional (leave empty if unused) ---
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: COMMUNITY_HEAD_PHONE
        sync: false
    disk:
      name: wastewatch-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
